name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 has no build for Ubuntu 26.04 (ubuntu-latest), so pin it
          # to the oldest still-supported runner image.
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          adb-lan-fix --version
          adb-lan-fix status
      - name: JS syntax check
        run: |
          node --check src/adb_lan_fix/adb_daemon.js
          node --check src/adb_lan_fix/adb_forward.js
