[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adb-lan-fix"
version = "0.1.0"
description = "Make adb reach LAN devices on macOS, where Local Network privacy blocks the adb binary"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "adb-lan-fix contributors" }]
keywords = ["adb", "android", "macos", "local-network", "wireless-debugging", "workaround"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
adb-lan-fix = "adb_lan_fix.cli:main"

[project.urls]
Homepage = "https://github.com/xxb/adb-lan-fix"
Issues = "https://github.com/xxb/adb-lan-fix/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adb_lan_fix = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
